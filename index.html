<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sketchstamp</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    /* Sketches are square; fixed size so the popup is laid out correctly before the image loads. */
    .sketch-popup img { display: block; width: 300px; height: 300px; object-fit: cover; }
    .sketch-popup .meta { margin-top: 6px; font: 12px/1.4 sans-serif; color: #444; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="storage/repository.js"></script>
  <script>
    const sketches = window.SKETCHSTAMP_REPOSITORY || [];

    const map = L.map("map").setView([45, 20], 5);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Pin from vanjakom/trek-mate-pins (75×75 round icon), shown at half size, anchored at its center.
    const sketchIcon = L.icon({
      iconUrl: "https://vanjakom.github.io/trek-mate-pins/blue_and_grey/art.png",
      iconSize: [38, 38],
      iconAnchor: [19, 19],
      popupAnchor: [0, -19]
    });

    // "20261031" -> "2026-10-31"
    const formatDate = d => `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}`;

    const markers = sketches.map(s => {
      // encodeURI keeps "/" but escapes anything unusual; "@" is valid in URL paths.
      const src = encodeURI(s.image);
      const popup =
        `<div class="sketch-popup">` +
          `<a href="${src}" target="_blank"><img src="${src}" alt="Sketch by ${s.user}"></a>` +
          `<div class="meta">${s.user} · ${formatDate(s.date)}</div>` +
        `</div>`;
      return L.marker([s.latitude, s.longitude], { icon: sketchIcon })
        .bindPopup(popup, { maxWidth: 320 })
        .addTo(map);
    });

    if (markers.length > 0) {
      map.fitBounds(L.featureGroup(markers).getBounds(), { padding: [40, 40], maxZoom: 14 });
    }
  </script>
</body>
</html>
