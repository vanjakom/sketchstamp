<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sketchstamp — timeline</title>
  <style>
    body { max-width: 640px; margin: 0 auto; padding: 16px; font: 15px/1.4 sans-serif; color: #222; }
    .sketch { margin-bottom: 32px; }
    .sketch img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; margin-top: 6px; }
    .pages { display: flex; justify-content: space-between; margin: 16px 0 32px; }
  </style>
</head>
<body>
  <div id="timeline"></div>
  <div class="pages" id="pages"></div>

  <script src="storage/repository.js"></script>
  <script>
    const PAGE_SIZE = 10;

    // Newest first. Same date: later entry in repository.js first (added later).
    const sketches = (window.SKETCHSTAMP_REPOSITORY || [])
      .map((s, i) => ({ ...s, index: i }))
      .sort((a, b) => b.date.localeCompare(a.date) || b.index - a.index);

    const pageCount = Math.max(1, Math.ceil(sketches.length / PAGE_SIZE));
    const requested = parseInt(new URLSearchParams(location.search).get("page"), 10) || 1;
    const page = Math.min(Math.max(requested, 1), pageCount);

    // "20261031" -> "2026-10-31"
    const formatDate = d => `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}`;

    document.getElementById("timeline").innerHTML = sketches
      .slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE)
      .map(s => {
        const coordinates = `${s.longitude.toFixed(5)}@${s.latitude.toFixed(5)}`;
        return `<div class="sketch">` +
            `<div>${formatDate(s.date)} by <a href="user/index.html?name=${encodeURIComponent(s.user)}">${s.user}</a></div>` +
            `<div><a href="index.html?image=${encodeURIComponent(s.image)}">${coordinates}</a></div>` +
            `<img src="${encodeURI(s.image)}" alt="Sketch by ${s.user}" loading="lazy">` +
          `</div>`;
      })
      .join("");

    document.getElementById("pages").innerHTML =
      `<span>${page > 1 ? `<a href="?page=${page - 1}">&larr; newer</a>` : ""}</span>` +
      `<span>page ${page} / ${pageCount}</span>` +
      `<span>${page < pageCount ? `<a href="?page=${page + 1}">older &rarr;</a>` : ""}</span>`;
  </script>
</body>
</html>
